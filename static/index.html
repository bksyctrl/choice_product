<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选品审核平台</title>
  <link rel="stylesheet" href="/static/styles.css?v=1.2.0">
</head>
<body>
  <div class="app hidden" id="appShell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CP</div>
        <div>
          <h1>选品审核</h1>
          <p>商品筛选与上架管理</p>
        </div>
      </div>

      <nav class="source-nav" id="sourceNav">
        <button class="active" data-source="unified">统一表</button>
        <button data-source="fastmoss">fastmoss</button>
        <button data-source="kalodata">kalodata</button>
        <button data-source="pod_cross_category">跨品类数据</button>
      </nav>
      <nav class="source-nav utility-nav">
        <button id="detailAnalysisNav" type="button">深度分析</button>
        <button id="expertTeamNav" type="button">专家团队</button>
      </nav>

      <section class="filter-panel">
        <div class="filter-panel-head">
          <h2>自定义筛选</h2>
          <button id="addFilterBtn" type="button">添加筛选条件</button>
        </div>
        <div id="activeFilters" class="active-filters"></div>
      </section>

      <div class="sidebar-actions">
        <button id="sidebarSearchBtn" class="primary">查询</button>
        <button id="resetFiltersBtn">重置</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">统一表</h2>
          <p>采集日期决定商品快照、销量求和与周期指标口径。</p>
        </div>
        <div class="view-switch">
          <button class="active" data-view="table">表格</button>
          <button data-view="cards">卡片</button>
        </div>
        <div class="user-menu">
          <span id="currentUserName">未登录</span>
          <button id="logoutBtn" type="button">退出登录</button>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <section class="top-filters">
        <label>关键词<input id="keyword" placeholder="标题搜索"></label>
        <input id="period" type="hidden" value="7d">
        <label>IP 起点<select id="ipGradeMin"><option value="">不限</option><option>E</option><option>D</option><option>C</option><option>B</option><option>A</option><option>S</option></select></label>
        <label>IP 终点<select id="ipGradeMax"><option value="">不限</option><option>E</option><option>D</option><option>C</option><option>B</option><option>A</option><option>S</option></select></label>
        <label>
          材质类型
          <select id="materialType">
            <option value="">全部</option>
            <option value="工厂材质">工厂材质</option>
            <option value="非工厂材质">非工厂材质</option>
            <option value="疑似材质">疑似材质</option>
            <option value="其他疑似材质">其他疑似材质</option>
          </select>
        </label>
        <label>材质细分<input id="materialCategories" placeholder="TPU,硅胶"></label>
        <label>排除材质<input id="excludeMaterialCategories" placeholder="钢化膜,贴纸"></label>
        <label id="topPodStatusFilter" class="pod-only-filter hidden">
          POD状态
          <select id="topPodStatus">
            <option value="">全部</option>
            <option value="0">待处理</option>
            <option value="1">提取中</option>
            <option value="2">已提取</option>
            <option value="3">提取失败</option>
            <option value="4">已废弃</option>
          </select>
        </label>
        <label>排序<select id="sortBy"><option value="product_card_sales">商品卡销量</option><option value="score">选品分</option><option value="total_sold">总销量</option><option value="sales_mom">POD销售环比</option><option value="sales_growth">销售环比</option><option value="product_card_ratio">商品卡占比</option><option value="launch_time">上架时间</option><option value="rating">评分</option><option value="ip_grade">IP等级</option></select></label>
        <button id="topSearchBtn" class="primary">查询</button>
      </section>

      <section class="list-toolbar">
        <div>
          <strong>商品列表</strong>
          <span id="periodHint">近7天数据</span>
        </div>
        <div>
          <button id="copyReadyBtn">复制待上架链接</button>
          <a id="exportReadyLink" class="button-link" href="/api/products/unified/export-ready-links">导出 Excel</a>
        </div>
      </section>

      <section id="content" class="content"></section>

      <footer class="pager">
        <button id="prevPage">上一页</button>
        <span id="pageInfo">第 1 页</span>
        <select id="pageSize"><option>10</option><option selected>30</option><option>50</option><option>100</option></select>
        <button id="nextPage">下一页</button>
      </footer>
    </main>
  </div>

  <dialog id="detailDialog">
    <div class="dialog-head"><h3>商品详情</h3><button id="closeDetail">关闭</button></div>
    <div id="detailBody" class="detail-body"></div>
  </dialog>
  <dialog id="imageDialog" class="image-dialog">
    <div class="dialog-head"><h3>商品图片</h3><button id="closeImage">关闭</button></div>
    <img id="largeImage" class="large-image" src="" alt="">
  </dialog>
  <dialog id="scoreDialog">
    <div class="dialog-head"><h3>选品分明细</h3><button id="closeScoreDialog" type="button">关闭</button></div>
    <div id="scoreDialogBody" class="score-dialog-body"></div>
  </dialog>
  <dialog id="filterDialog" class="filter-dialog">
    <div class="dialog-head"><h3>添加筛选条件</h3><button id="closeFilterDialog" type="button">关闭</button></div>
    <div id="filterOptions" class="filter-options"></div>
  </dialog>
  <div id="toast" class="toast"></div>

  <script>
    const state = { source: 'unified', mode: 'products', currentUser: null, detailAnalysisType: 'ip', expertSessionId: null, expertSessions: [], expertMessages: [], expertImages: [], expertBaseFiles: defaultExpertBaseFiles().join('\n'), view: 'table', page: 1, pageSize: 30, total: 0, items: [], periodLabel: '近7天', sortBy: 'product_card_sales', sortOrder: 'desc' };
    const statusText = { PENDING: '待选中', REVIEWING: '待复核', READY: '待上架', PUBLISHED: '已上架', OTHER: '其他' };
    const sourceText = { unified: '统一表', fastmoss: 'fastmoss', kalodata: 'kalodata', pod_cross_category: '跨品类数据' };
    const $ = (id) => document.getElementById(id);
    const filterDefinitions = [
      { key: 'dateRecord', label: '采集日期', type: 'dateRange', startId: 'dateStart', endId: 'dateEnd', startLabel: '采集开始', endLabel: '采集结束' },
      { key: 'launchTime', label: '上架时间', type: 'dateRange', startId: 'launchStart', endId: 'launchEnd', startLabel: '上架开始', endLabel: '上架结束' },
      { key: 'commission', label: '佣金比例', type: 'range', minId: 'commissionMin', maxId: 'commissionMax', suffix: '%', placeholderMin: '最低佣金', placeholderMax: '最高佣金' },
      { key: 'author', label: '达人数量', type: 'range', minId: 'authorMin', maxId: 'authorMax', placeholderMin: '最少达人', placeholderMax: '最多达人' },
      { key: 'productCardRatio', label: '商品卡比例', type: 'range', minId: 'productCardRatioMin', maxId: 'productCardRatioMax', suffix: '%', placeholderMin: '最低比例', placeholderMax: '最高比例' },
      { key: 'transportFee', label: '运费', type: 'range', minId: 'transportFeeMin', maxId: 'transportFeeMax', placeholderMin: '最低运费', placeholderMax: '最高运费' },
      { key: 'sold', label: '总销量', type: 'range', minId: 'soldMin', maxId: 'soldMax', placeholderMin: '最低销量', placeholderMax: '最高销量' },
      { key: 'videoRatio', label: '视频成交占比', type: 'range', minId: 'videoRatioMin', maxId: 'videoRatioMax', suffix: '%', placeholderMin: '最低占比', placeholderMax: '最高占比' },
      { key: 'rating', label: '评分', type: 'range', minId: 'ratingMin', maxId: 'ratingMax', placeholderMin: '最低评分', placeholderMax: '最高评分' },
      { key: 'price', label: '售价范围', type: 'range', minId: 'priceMin', maxId: 'priceMax', placeholderMin: '最低售价', placeholderMax: '最高售价' },
      { key: 'basePrice', label: '定价范围', type: 'range', minId: 'basePriceMin', maxId: 'basePriceMax', placeholderMin: '最低定价', placeholderMax: '最高定价' },
      { key: 'podScore', label: 'POD综合分', type: 'range', minId: 'scoreMin', maxId: 'scoreMax', placeholderMin: '最低分', placeholderMax: '最高分' },
      { key: 'podSalesMom', label: '销售环比', type: 'range', minId: 'salesMomMin', maxId: 'salesMomMax', suffix: '%', placeholderMin: '最低环比', placeholderMax: '最高环比' },
      {
        key: 'auditStatus',
        label: '商品状态',
        type: 'select',
        id: 'auditStatus',
        options: [
          ['', '全部'],
          ['PENDING', '待选中'],
          ['REVIEWING', '待复核'],
          ['READY', '待上架'],
          ['PUBLISHED', '已上架'],
          ['OTHER', '其他'],
        ],
      },
      {
        key: 'podStatus',
        label: 'POD状态',
        type: 'select',
        id: 'podStatus',
        options: [
          ['', '全部'],
          ['0', '待处理'],
          ['1', '提取中'],
          ['2', '已提取'],
          ['3', '提取失败'],
          ['4', '已废弃'],
        ],
      },
    ];
    const filterByKey = Object.fromEntries(filterDefinitions.map(item => [item.key, item]));
    const activeFilterKeys = new Set();
    const filterValues = {};
    const paramMap = {
      keyword: 'keyword', dateStart: 'date_start', dateEnd: 'date_end',
      launchStart: 'launch_start', launchEnd: 'launch_end', auditStatus: 'audit_status',
      ipGradeMin: 'ip_grade_min', ipGradeMax: 'ip_grade_max', materialType: 'material_type',
      materialCategories: 'material_categories', excludeMaterialCategories: 'exclude_material_categories',
      soldMin: 'sold_min', soldMax: 'sold_max', saleAmountMin: 'sale_amount_min', saleAmountMax: 'sale_amount_max',
      priceMin: 'price_min', priceMax: 'price_max', commissionMin: 'commission_min', commissionMax: 'commission_max',
      authorMin: 'author_min', authorMax: 'author_max', ratingMin: 'rating_min', ratingMax: 'rating_max',
      basePriceMin: 'base_price_min', basePriceMax: 'base_price_max',
      scoreMin: 'score_min', scoreMax: 'score_max', salesMomMin: 'sales_mom_min', salesMomMax: 'sales_mom_max',
      podStatus: 'pod_status',
      topPodStatus: 'pod_status',
      transportFeeMin: 'transport_fee_min', transportFeeMax: 'transport_fee_max',
      productCardRatioMin: 'product_card_ratio_min', productCardRatioMax: 'product_card_ratio_max',
      videoRatioMin: 'video_ratio_min', videoRatioMax: 'video_ratio_max',
    };

    async function initAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '未登录');
        const user = json.data.user || {};
        state.currentUser = user;
        $('currentUserName').textContent = user.display_name || user.username || '已登录';
        const canUseExpertTeam = ['admin', 'manager'].includes(String(user.role || '').toLowerCase());
        $('expertTeamNav').classList.toggle('hidden', !canUseExpertTeam);
        $('appShell').classList.remove('hidden');
        syncPodTopFilters();
        await loadDefaultDateAndData();
      } catch (error) {
        const next = encodeURIComponent(`${location.pathname}${location.search}`);
        location.href = `/static/login.html?next=${next}`;
      }
    }

    document.querySelectorAll('#sourceNav button').forEach(btn => btn.addEventListener('click', () => {
      state.mode = 'products';
      state.source = btn.dataset.source;
      state.page = 1;
      state.sortBy = state.source === 'pod_cross_category' ? 'score' : 'product_card_sales';
      state.sortOrder = 'desc';
      $('sortBy').value = state.sortBy;
      syncPodTopFilters();
      document.querySelectorAll('#sourceNav button').forEach(item => item.classList.remove('active'));
      btn.classList.add('active');
      $('detailAnalysisNav').classList.remove('active');
      $('expertTeamNav').classList.remove('active');
      $('pageTitle').textContent = sourceText[state.source];
      $('exportReadyLink').href = `/api/products/${state.source}/export-ready-links`;
      loadDefaultDateAndData();
    }));
    $('detailAnalysisNav').addEventListener('click', () => {
      openDetailAnalysisWorkspace();
    });
    $('expertTeamNav').addEventListener('click', () => {
      if (!canUseExpertTeam()) {
        showToast('当前账号没有专家团队权限');
        return;
      }
      openExpertTeamWorkspace();
    });

    function canUseExpertTeam() {
      return ['admin', 'manager'].includes(String(state.currentUser?.role || '').toLowerCase());
    }

    function syncPodTopFilters() {
      const isPod = state.source === 'pod_cross_category';
      $('topPodStatusFilter').classList.toggle('hidden', !isPod);
      if (!isPod) {
        $('topPodStatus').value = '';
        delete filterValues.topPodStatus;
      }
    }

    function openDetailAnalysisWorkspace(type = state.detailAnalysisType || 'ip') {
      state.mode = 'detailAnalysis';
      state.detailAnalysisType = type;
      document.querySelectorAll('#sourceNav button').forEach(item => item.classList.remove('active'));
      $('detailAnalysisNav').classList.add('active');
      $('expertTeamNav').classList.remove('active');
      renderDetailAnalysisPage();
      loadDetailAnalyses();
    }

    function openExpertTeamWorkspace() {
      if (!canUseExpertTeam()) {
        showToast('当前账号没有专家团队权限');
        return;
      }
      state.mode = 'expertTeam';
      document.querySelectorAll('#sourceNav button').forEach(item => item.classList.remove('active'));
      $('detailAnalysisNav').classList.remove('active');
      $('expertTeamNav').classList.add('active');
      renderExpertTeamPage();
      loadExpertSessions();
    }

    function renderExpertTeamPage() {
      $('pageTitle').textContent = '专家团队';
      $('stats').innerHTML = '';
      $('periodHint').textContent = '与专家领导层沟通，由它调度业务专家';
      $('content').innerHTML = `
        <section class="expert-team-page">
          <div class="expert-team-layout">
            <aside class="expert-team-panel">
              <h3>团队结构</h3>
              <div class="expert-session-box">
                <div class="expert-session-head">
                  <strong>会话记忆</strong>
                  <span>session_id 控制</span>
                </div>
                <div class="expert-session-list">
                  ${expertSessionsHtml()}
                </div>
              </div>
              <div class="expert-base-files">
                <div class="expert-session-head">
                  <strong>基底文件</strong>
                  <span>每行一个路径</span>
                </div>
                <textarea id="expertBaseFilesInput" rows="5" placeholder="例如：
D:\\choice_product\\app.py
D:\\choice_product\\static\\index.html
D:\\choice_product\\static\\styles.css">${escapeHtml(state.expertBaseFiles)}</textarea>
                <div class="expert-base-actions">
                  <button type="button" data-expert-default-files>核心文件</button>
                  <button type="button" data-expert-clear-files>清空</button>
                </div>
                <p class="expert-base-hint">发送消息前会先只读这些文件；仅允许读取 D:\\choice_product 内的文本文件。</p>
              </div>
              <div class="expert-role-group">
                <strong>专家领导层</strong>
                <span>首席项目规划专家</span>
                <span>专家团队管理者</span>
                <span>数据方法论负责人</span>
                <span>用户体验负责人</span>
              </div>
              <div class="expert-role-group">
                <strong>业务专家层</strong>
                <span>数据分析专家</span>
                <span>IP合规专家</span>
                <span>材质/视觉专家</span>
                <span>运营专家</span>
                <span>商品产品经理专家</span>
                <span>智能选品总评专家</span>
                <span>技术架构专家</span>
                <span>项目文件侦察员</span>
              </div>
              <div class="expert-role-group">
                <strong>执行交接对象</strong>
                <span>技术执行人员A / Codex</span>
                <span>业务执行团队</span>
              </div>
              <p class="expert-team-note">你先和专家领导层沟通，它会判断该调用哪些专家、谁具备执行能力，并在你确认执行后输出给A能听懂的执行交接单。</p>
            </aside>
            <section class="expert-chat">
              <div class="expert-chat-head">
                <div>
                  <strong>团队对话</strong>
                  <p>这套团队不只服务当前项目，也可以服务其他用户和其他项目。</p>
                </div>
                <button type="button" data-new-expert-session>新会话</button>
              </div>
              <div id="expertMessages" class="expert-messages">${expertMessagesHtml()}</div>
              <div class="expert-input-row">
                <div class="expert-input-main">
                  <textarea id="expertMessageInput" rows="3" placeholder="例如：这个需求谁有能力执行？确认执行，把方案交给技术执行人员A；或者：这个商品需要哪些专家一起判断？"></textarea>
                  <div class="expert-image-tools">
                    <label class="expert-image-upload">
                      添加图片
                      <input id="expertImageInput" type="file" accept="image/*" multiple>
                    </label>
                    <span>支持 Ctrl+V 粘贴图片、拖拽图片到输入框、或点击添加图片</span>
                  </div>
                  <div id="expertImageTray" class="expert-image-tray">${expertImagesHtml()}</div>
                </div>
                <button id="sendExpertMessage" type="button" class="primary">发送</button>
              </div>
              <p class="expert-team-tip">提示：你可以直接说你的想法、目标、担心的问题；专家领导会先拆解，再安排业务专家。</p>
            </section>
          </div>
        </section>`;
      $('pageInfo').textContent = '专家团队';
      $('prevPage').disabled = true;
      $('nextPage').disabled = true;
      $('sendExpertMessage').addEventListener('click', sendExpertTeamMessage);
      $('expertBaseFilesInput')?.addEventListener('input', event => {
        state.expertBaseFiles = event.target.value;
      });
      document.querySelector('[data-expert-default-files]')?.addEventListener('click', () => {
        state.expertBaseFiles = [
          'D:\\choice_product\\app.py',
          'D:\\choice_product\\static\\index.html',
          'D:\\choice_product\\static\\styles.css',
          'D:\\choice_product\\tools\\analyze_single_product.py',
          'D:\\choice_product\\agent-center\\README.md',
        ].join('\n');
        renderExpertTeamPage();
      });
      document.querySelector('[data-expert-clear-files]')?.addEventListener('click', () => {
        state.expertBaseFiles = '';
        renderExpertTeamPage();
      });
      $('expertMessageInput').addEventListener('keydown', event => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) sendExpertTeamMessage();
      });
      $('expertImageInput')?.addEventListener('change', event => {
        addExpertImageFiles(event.target.files);
        event.target.value = '';
      });
      $('expertImageTray')?.addEventListener('click', event => {
        const btn = event.target.closest('[data-remove-expert-image]');
        if (!btn) return;
        state.expertImages.splice(Number(btn.dataset.removeExpertImage), 1);
        renderExpertTeamPage();
      });
      const expertInputRow = document.querySelector('.expert-input-row');
      expertInputRow?.addEventListener('paste', handleExpertImagePaste);
      $('expertMessageInput')?.addEventListener('paste', handleExpertImagePaste);
      expertInputRow?.addEventListener('dragover', event => {
        event.preventDefault();
        expertInputRow.classList.add('dragging');
      });
      expertInputRow?.addEventListener('dragleave', () => {
        expertInputRow.classList.remove('dragging');
      });
      expertInputRow?.addEventListener('drop', event => {
        event.preventDefault();
        expertInputRow.classList.remove('dragging');
        addExpertImageFiles(Array.from(event.dataTransfer?.files || []).filter(file => file.type.startsWith('image/')));
      });
      document.querySelector('[data-new-expert-session]')?.addEventListener('click', () => {
        state.expertSessionId = null;
        state.expertMessages = [];
        state.expertImages = [];
        renderExpertTeamPage();
      });
      document.querySelectorAll('[data-expert-session-id]').forEach(btn => btn.addEventListener('click', () => {
        loadExpertSessionMessages(Number(btn.dataset.expertSessionId));
      }));
      document.querySelectorAll('[data-delete-expert-session]').forEach(btn => btn.addEventListener('click', event => {
        event.stopPropagation();
        deleteExpertSession(Number(btn.dataset.deleteExpertSession));
      }));
    }

    function expertSessionsHtml() {
      if (!state.expertSessions.length) {
        return '<div class="expert-session-empty">暂无历史会话</div>';
      }
      return state.expertSessions.map(session => `
        <button type="button" class="expert-session-item ${Number(session.id) === Number(state.expertSessionId) ? 'active' : ''}" data-expert-session-id="${session.id}">
          <span>${escapeHtml(session.title || `会话 ${session.id}`)}</span>
          <small>#${session.id}</small>
          <i data-delete-expert-session="${session.id}" title="删除这段记忆">删除</i>
        </button>`).join('');
    }

    async function loadExpertSessions() {
      if (!canUseExpertTeam()) return;
      try {
        const res = await fetch('/api/expert-team/sessions', { credentials: 'same-origin' });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '会话加载失败');
        state.expertSessions = json.data.sessions || [];
        renderExpertTeamPage();
      } catch (error) {
        showToast(`专家会话加载失败：${error.message}`);
      }
    }

    async function loadExpertSessionMessages(sessionId) {
      if (!sessionId) return;
      try {
        const res = await fetch(`/api/expert-team/sessions/${sessionId}/messages`, { credentials: 'same-origin' });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '会话恢复失败');
        state.expertSessionId = sessionId;
        state.expertMessages = json.data.messages || [];
        renderExpertTeamPage();
        showToast(`已恢复会话 #${sessionId}`);
      } catch (error) {
        showToast(`恢复会话失败：${error.message}`);
      }
    }

    async function deleteExpertSession(sessionId) {
      if (!sessionId) return;
      try {
        const res = await fetch(`/api/expert-team/sessions/${sessionId}`, { method: 'DELETE', credentials: 'same-origin' });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '删除失败');
        if (Number(state.expertSessionId) === Number(sessionId)) {
          state.expertSessionId = null;

    function addExpertImageFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      if (state.expertImages.length >= 6) {
        showToast('一次最多添加 6 张图片');
        return;

      const reader = new FileReader();
      reader.onload = () => {

          mime_type: file.type,
          size: file.size,
          data_url: reader.result,
        });
        renderExpertTeamPage();
      };
      reader.readAsDataURL(file);

    function handleExpertImagePaste(event) {
      const files = Array.from(event.clipboardData?.files || []).filter(file => file.type.startsWith('image/'));
      const itemFiles = Array.from(event.clipboardData?.items || [])
        .filter(item => item.kind === 'file' && item.type.startsWith('image/'))
        .map(item => item.getAsFile())
        .filter(Boolean);
      const images = [...files, ...itemFiles];
      if (!images.length) return;
      event.preventDefault();
      addExpertImageFiles(images);

    async function sendExpertTeamMessage() {
      const input = $('expertMessageInput');
      const message = input.value.trim();
      const images = state.expertImages.map(image => ({ ...image }));
      if (!message && !images.length) return showToast('请输入要讨论的问题或添加图片');
      const displayMessage = message || '请分析我发送的图片';
      state.expertMessages.push({ role: 'user', content: displayMessage + (images.length ? `\n[已附加 ${images.length} 张图片]` : '') });
      input.value = '';
      state.expertImages = [];
      renderExpertTeamPage();
      state.expertMessages.push({ role: 'assistant', content: 'CEO正在决策并分发专家...' });
      renderExpertTeamPage();
      try {
        const res = await fetch('/api/expert-team/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            session_id: state.expertSessionId,
            project_code: 'choice_product',
            project_context: '当前项目是选品与数据监控系统，但专家团队需要作为可复用团队能力，面向所有用户和项目。',
            message: displayMessage,
            images,
            base_files: parseExpertBaseFiles(),
          }),
        });
        const raw = await res.text();
        let json;
        try {
          json = JSON.parse(raw);
        } catch (_error) {
          const preview = raw.replace(/\s+/g, ' ').slice(0, 120);
          throw new Error(`接口返回的不是JSON，HTTP ${res.status}：${preview}`);
        }
        if (!json.ok) throw new Error(json.error || '专家团队回复失败');
        state.expertSessionId = json.data.session?.id || state.expertSessionId;
        state.expertMessages = state.expertMessages.filter(item => item.content !== 'CEO正在决策并分发专家...');
        state.expertMessages.push({ role: 'assistant', content: json.data.message || '' });
        renderExpertTeamPage();
        loadExpertSessions();
      } catch (error) {
        state.expertMessages = state.expertMessages.filter(item => item.content !== 'CEO正在决策并分发专家...');

    function renderFilterOptions() {
      $('filterOptions').innerHTML = filterDefinitions.map(def => `
        <button type="button" data-filter-key="${def.key}" ${activeFilterKeys.has(def.key) ? 'disabled' : ''}>
          <span>${def.label}</span>

      `).join('');

    function filterOptionHint(def) {
      if (def.type === 'dateRange') return '输入开始时间与结束时间';
      if (def.type === 'select') return '选择状态';
      return '输入最小值与最大值';
    }

    function addFilter(key) {
      activeFilterKeys.add(key);
      renderActiveFilters();
    }

    function removeFilter(key) {
      const def = filterByKey[key];
      activeFilterKeys.delete(key);
      filterInputIds(def).forEach(id => delete filterValues[id]);
      renderActiveFilters();
    }

    function renderActiveFilters() {
      if (!activeFilterKeys.size) {
        $('activeFilters').innerHTML = '<div class="empty-filter">点击“添加筛选条件”开始组合筛选</div>';
        return;
      }
      $('activeFilters').innerHTML = Array.from(activeFilterKeys).map(key => filterCardTemplate(filterByKey[key])).join('');
      document.querySelectorAll('[data-remove-filter]').forEach(btn => btn.addEventListener('click', () => removeFilter(btn.dataset.removeFilter)));
      document.querySelectorAll('[data-date-preset]').forEach(btn => btn.addEventListener('click', () => applyDatePreset(btn.dataset.datePreset)));
      document.querySelectorAll('[data-open-date-picker]').forEach(btn => btn.addEventListener('click', () => openDatePicker(btn.dataset.openDatePicker)));
      document.querySelectorAll('[data-filter-input]').forEach(input => {
        const rememberValue = () => { filterValues[input.id] = input.value; };
        input.addEventListener('input', rememberValue);
        input.addEventListener('change', rememberValue);
      });
    }

    function filterCardTemplate(def) {
      return `<div class="filter-card">
        <div class="filter-card-head"><strong>${def.label}</strong><button type="button" data-remove-filter="${def.key}">移除</button></div>
        ${filterControlTemplate(def)}
      </div>`;
    }

    function filterControlTemplate(def) {
      if (def.type === 'dateRange') {
        if (def.key === 'dateRecord') {
          return `<div class="filter-control date-preset-control">
            <div class="date-preset-buttons">
              <button type="button" data-date-preset="yesterday">昨日</button>
              <button type="button" data-date-preset="7d">过去7天</button>
              <button type="button" data-date-preset="30d">过去30天</button>
              <button type="button" data-date-preset="90d">过去90天</button>
              <button type="button" data-date-preset="180d">过去180天</button>
              <button type="button" data-date-preset="custom">自定义</button>
            </div>
            <div class="filter-control range-row date-input-row">
              ${datePickerInput(def.startId)}
              <span>→</span>
              ${datePickerInput(def.endId)}
            </div>
          </div>`;
        }
        return `<div class="filter-control two-cols">
          <label>${def.startLabel}${datePickerInput(def.startId)}</label>
          <label>${def.endLabel}${datePickerInput(def.endId)}</label>
        </div>`;
      }
      if (def.type === 'select') {
        return `<label class="filter-control">${def.label}
          <select data-filter-input id="${def.id}">
            ${def.options.map(([value, label]) => `<option value="${value}" ${(filterValues[def.id] || '') === value ? 'selected' : ''}>${label}</option>`).join('')}
          </select>
        </label>`;
      }
      return `<div class="filter-control range-row">
        <input data-filter-input id="${def.minId}" inputmode="decimal" placeholder="${def.placeholderMin || '最小值'}${def.suffix || ''}" value="${escapeHtml(filterValues[def.minId] || '')}">
        <span>-</span>
        <input data-filter-input id="${def.maxId}" inputmode="decimal" placeholder="${def.placeholderMax || '最大值'}${def.suffix || ''}" value="${escapeHtml(filterValues[def.maxId] || '')}">
      </div>`;
    }

    function datePickerInput(id) {
      return `<div class="date-picker-field">
        <input data-filter-input id="${id}" type="date" value="${escapeHtml(filterValues[id] || '')}">
        <button type="button" data-open-date-picker="${id}" title="选择日期" aria-label="选择日期">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4"></path><path d="M8 3v4"></path><path d="M3 10h18"></path></svg>
        </button>
      </div>`;
    }

    function openDatePicker(id) {
      const input = $(id);
      if (!input) return;
      input.focus();
      if (typeof input.showPicker === 'function') {
        input.showPicker();
      } else {
        input.click();
      }
    }

    function filterInputIds(def) {
      if (!def) return [];
      if (def.type === 'dateRange') return [def.startId, def.endId];
      if (def.type === 'select') return [def.id];
      return [def.minId, def.maxId];
    }

    async function applyDatePreset(preset) {
      if (preset === 'custom') return;
      const latest = await getLatestCollectionDate();
      const days = preset === 'yesterday' ? 1 : Number(preset.replace('d', '')) || 7;
      setFilterValue('dateStart', formatDate(shiftDate(latest, -(days - 1))));
      setFilterValue('dateEnd', formatDate(latest));
    }

    async function getLatestCollectionDate() {
      try {
        const res = await fetch(`/api/products/latest-date?source=${state.source}`);
        const json = await res.json();
        if (json.ok && json.data.latest_date) return new Date(json.data.latest_date.slice(0, 10));
      } catch (error) {
        console.warn('latest date load failed', error);
      }
      return shiftDate(new Date(), -1);
    }

    function shiftDate(date, days) {
      const copy = new Date(date);
      copy.setDate(copy.getDate() + days);
      return copy;
    }
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function formatShortDate(date) {
      return `${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
    }

    async function loadDefaultDateAndData() {
      const latest = await getLatestCollectionDate();
      activeFilterKeys.add('dateRecord');
      setFilterValue('dateStart', formatDate(latest));
      setFilterValue('dateEnd', formatDate(latest));
      renderActiveFilters();
      await loadAll();
    }
    function setFilterValue(id, value) {
      filterValues[id] = value;
      if ($(id)) $(id).value = value;
    }
    function getFilterValue(id) {
      const node = $(id);
      return node ? node.value.trim() : String(filterValues[id] || '').trim();
    }
    function derivePeriodFromCollectionDates() {
      const start = getFilterValue('dateStart');
      const end = getFilterValue('dateEnd');
      if (!start || !end) return '7d';
      const startTime = Date.parse(start);
      const endTime = Date.parse(end);
      if (!Number.isFinite(startTime) || !Number.isFinite(endTime) || endTime < startTime) return '7d';
      const days = Math.round((endTime - startTime) / 86400000) + 1;
      return [7, 30, 90, 180].includes(days) ? `${days}d` : '7d';
    }
    function collectionDateHint() {
      const start = getFilterValue('dateStart');
      const end = getFilterValue('dateEnd');
      if (!start && !end) return '全部采集日期';
      return `${start || '开始日期'} → ${end || '结束日期'}`;
    }

    async function loadAll() { await Promise.all([loadStats(), loadProducts()]); }
    function buildParams() {
      const derivedPeriod = derivePeriodFromCollectionDates();
      $('period').value = derivedPeriod;
      const params = new URLSearchParams({ source: state.source, page: state.page, page_size: state.pageSize, period: derivedPeriod, sort_by: state.sortBy, sort_order: state.sortOrder });
      Object.entries(paramMap).forEach(([id, key]) => {
        const value = getFilterValue(id);
        if (value) params.set(key, value);
      });
      return params;
    }

    async function loadProducts() {
      $('content').innerHTML = '<div style="text-align: center; padding: 100px;"><div style="border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div><p style="margin-top:15px; color: #666; font-size: 14px;">数据加载中，请稍候...</p></div><style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>';
      try {
        const res = await fetch(`/api/products?${buildParams()}`);
        const json = await res.json();
        if (!json.ok) {
          $('content').innerHTML = '<div class="empty">加载失败</div>';
          return showToast(json.error || '加载失败');
        }
        state.items = json.data.items || [];

        state.period = json.data.period;
        state.periodLabel = json.data.period_label || '近7天';

        renderPager();

        $('content').innerHTML = '<div class="empty">网络请求失败，请稍后重试</div>';
        showToast('网络请求失败');
      }
    }

    function dedupeLatestItems(items) {
      const latestByProduct = new Map();
      items.forEach(item => {
        const key = String(item.product_id || '');
        if (!key) return;
        const current = latestByProduct.get(key);
        if (!current || compareDateRecord(item.date_record, current.date_record) > 0) {
          latestByProduct.set(key, item);
        }
      });
      return Array.from(latestByProduct.values());
    }

    function compareDateRecord(left, right) {
      const leftTime = Date.parse(String(left || '').replaceAll('/', '-')) || 0;
      const rightTime = Date.parse(String(right || '').replaceAll('/', '-')) || 0;
      return leftTime - rightTime;
    }

    async function loadStats() {
      const params = buildParams();
      params.delete('page');
      params.delete('page_size');
      params.delete('period');
      params.delete('sort_by');
      params.delete('sort_order');
      const res = await fetch(`/api/products/stats?${params}`);
      const json = await res.json();
      if (!json.ok) return;
      const data = json.data;
      if (state.source === 'pod_cross_category') {
        const pod = data.pod_statuses || {};
        const cards = [
          ['全部商品', data.total || 0],
          ['待处理', pod['0'] || 0],
          ['提取中', pod['1'] || 0],
          ['已提取', pod['2'] || 0],
          ['提取失败', pod['3'] || 0],
          ['已废弃', pod['4'] || 0],
        ];
        $('stats').innerHTML = cards.map(([label, value]) => `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`).join('');
        return;
      }
      const cards = [
        ['待选中', data.statuses.PENDING || 0], ['待复核', data.statuses.REVIEWING || 0],
        ['待上架', data.statuses.READY || 0], ['已上架', data.statuses.PUBLISHED || 0],
        ['S/A/B', (data.ip_grades.S || 0) + (data.ip_grades.A || 0) + (data.ip_grades.B || 0)],
        ['工厂材质', data.materials['工厂材质'] || 0], ['非工厂材质', data.materials['非工厂材质'] || 0],
        ['疑似材质', (data.materials['疑似材质'] || 0) + (data.materials['其他疑似材质'] || 0)]
      ];
      $('stats').innerHTML = cards.map(([label, value]) => `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`).join('');
    }

    function renderItems() {
      if (!state.items.length) { $('content').innerHTML = '<div class="empty">没有符合条件的商品</div>'; return; }
      state.view === 'cards' ? renderCards() : renderTable();

      }
      $('content').innerHTML = `<div class="table-wrap"><table><thead><tr>
        <th>商品图</th><th>商品标题</th><th>${sortHeader('score', '选品分')}</th><th>${sortHeader('product_card_sales', '商品卡销量')}</th><th>近7天销量占比</th><th>近28天销量占比</th>
        <th>${sortHeader('total_sold', '总销量')}</th><th class="metric-header">${sortHeader('sales_growth', '销售环比')}<span class="metric-hint" title="销售环比 = ((当前销量 / 上期销量) - 1) * 100%。当前销量按所选采集日期范围求和，上期销量取前一段同等数量的采集日期；上期销量为0时展示N/A。">?</span></th>
        <th>${sortHeader('product_card_ratio', '商品卡占比')}</th><th>${sortHeader('launch_time', '上架时间')}</th><th>${sortHeader('rating', '评分')}</th><th>${sortHeader('ip_grade', 'IP等级')}</th>
        <th>材质标签</th><th>当前状态</th><th>链接</th><th>详情</th>
      </tr></thead><tbody>${state.items.map(rowTemplate).join('')}</tbody></table></div>`;
      bindRowActions();
      bindSortHeaders();
    }

    function renderPodTable() {
      $('content').innerHTML = `<div class="table-wrap"><table><thead><tr>
        <th>商品图</th><th>商品标题</th><th>类目</th><th>${sortHeader('score', 'POD综合分')}</th>
        <th>${sortHeader('sold', '当前销量')}</th><th>${sortHeader('total_sold', '累计销量')}</th><th>${sortHeader('sales_mom', '销售环比')}</th>
        <th>${sortHeader('rating', '评分')}</th><th>${sortHeader('aweme_count', '视频数')}</th><th>${sortHeader('launch_time', '上架时间')}</th>
        <th>POD状态</th><th>链接</th><th>操作</th>
      </tr></thead><tbody>${state.items.map(podRowTemplate).join('')}</tbody></table></div>`;
      bindRowActions();
      bindSortHeaders();
      bindPodActions();
    }

    function podRowTemplate(item) {
      return `<tr>
        <td><button class="image-button" data-image="${item.image_url}" data-title="${escapeHtml(item.title)}"><img class="thumb" src="${item.image_url}" alt=""></button></td>
        <td class="title-cell">${productTitleCell(item)}</td>
        <td>${escapeHtml([item.category_l1, item.category_l2, item.category_l3].filter(Boolean).join(' / ') || 'N/A')}</td>
        <td>${selectionScoreBadge(item.selection_score || item.pod_score, item)}</td>
        <td>${escapeHtml(item.sold_count)}</td>
        <td>${escapeHtml(item.total_sold_count)}</td>
        <td>${escapeHtml(item.pod_sales_mom || 'N/A')}${item.pod_sales_mom ? '%' : ''}</td>
        <td>${escapeHtml(item.rating)}</td>
        <td>${escapeHtml(item.aweme_count || '0')}</td>
        <td>${escapeHtml(item.launch_time)}</td>
        <td>${illustrationStatusBadge(item.illustration_status ?? item.pod_status, item.illustration_result_url, item.illustration_extractable)}${illustrationExtractabilityBadge(item)}${illustrationCheckButton(item)}</td>
        <td>${platformLinks(item)}</td>
        <td class="pod-actions"><button data-detail="${item.product_id}" data-date="${item.date_record}">站内详情</button>${podExtractButton(item)}</td>
      </tr>`;
    }

    function selectionScoreBadge(value, item = null) {
      if (value === null || value === undefined || String(value).trim() === '') {
        return '<span class="pod-score muted">未评分</span>';
      }
      const score = Number(value);
      if (!Number.isFinite(score)) return '<span class="pod-score muted">未评分</span>';
      const cls = score >= 75 ? 'high' : (score >= 50 ? 'mid' : 'low');
      const detailButton = item
        ? `<button type="button" class="score-detail-link" data-score-detail="${escapeHtml(item.product_id)}" data-date="${escapeHtml(item.date_record || '')}">明细</button>`
        : '';
      return `<span class="score-cell"><span class="pod-score ${cls}">${score.toFixed(2)}</span>${detailButton}</span>`;
    }

    function podScoreBadge(value) {
      if (value === null || value === undefined || String(value).trim() === '') {
        return '<span class="pod-score muted">未评分</span>';
      }
      const score = Number(value);
      if (!Number.isFinite(score)) return '<span class="pod-score muted">未评分</span>';
      const cls = score >= 75 ? 'high' : (score >= 50 ? 'mid' : 'low');
      return `<span class="pod-score ${cls}">${score.toFixed(2)}</span>`;
    }

    function illustrationStatusBadge(value, resultUrl, extractable = null) {
      const hasExtractableArg = arguments.length >= 3;
      const extractableText = extractable === null || extractable === undefined ? '' : String(extractable).trim();
      const isUnjudged = hasExtractableArg && extractableText === '';
      const status = isUnjudged ? 0 : Number(value ?? 0);
      const html = podStatusBadge(status);
      if (status === 2 && resultUrl) {
        return `${html}<a class="illustration-result-link" href="${escapeHtml(resultUrl)}" target="_blank" rel="noreferrer">结果图</a>`;
      }
      return html;
    }

    function illustrationExtractabilityBadge(item) {
      const value = item?.illustration_extractable;
      const reason = item?.illustration_extract_reason || '';
      if (value === null || value === undefined || String(value).trim() === '') {
        return '<span class="illustration-extract-badge pending">未判断</span>';
      }
      const canExtract = Number(value) === 1;
      const label = canExtract ? '可提取' : '不可提取';
      const cls = canExtract ? 'yes' : 'no';
      const title = reason ? ` title="${escapeHtml(reason)}"` : '';
      return `<span class="illustration-extract-badge ${cls}"${title}>${label}</span>`;
    }

    function illustrationCheckButton(item) {
      return '';
    }

    function podStatusBadge(value) {
      const map = {
        0: ['待处理', 'pending'],
        1: ['提取中', 'processing'],
        2: ['已提取', 'done'],
        3: ['提取失败', 'failed'],
        4: ['已废弃', 'discarded'],
      };
      const [label, cls] = map[Number(value ?? 0)] || map[0];
      return `<span class="pod-status ${cls}">${label}</span>`;
    }

    function podExtractButton(item) {
      if (Number(item.illustration_extractable) !== 1) return '';
      const status = Number(item.illustration_status ?? item.pod_status ?? 0);
      if (status === 1) return '<button type="button" disabled>提取中...</button>';
      if (status === 2) return `<button type="button" data-pod-extract="${escapeHtml(item.product_id)}" data-date="${escapeHtml(item.date_record || '')}">重新提取</button>`;
      if (status === 4) return '';
      const label = status === 3 ? '重试提取' : '提取插画';
      return `<button type="button" data-pod-extract="${escapeHtml(item.product_id)}" data-date="${escapeHtml(item.date_record || '')}">${label}</button>`;
    }

    function bindPodActions() {
      document.querySelectorAll('[data-pod-extract]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const productId = btn.dataset.podExtract;
          const dateRecord = btn.dataset.date || '';
          btn.disabled = true;
          btn.textContent = '提交中...';
          try {
            const res = await fetch(`/api/products/pod_cross_category/${encodeURIComponent(productId)}/extract`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ date_record: dateRecord, style_prompt: 'POD视觉素材提取', force: true }),
            });
            const json = await res.json();
            if (!json.ok) throw new Error(json.error || '任务提交失败');
            showToast(json.data?.message || '插画提取任务已创建');
            loadAll();
          } catch (error) {
            btn.disabled = false;
            btn.textContent = '提取插画';
            showToast(error.message || '任务提交失败');
          }
        });
      });
    }

    function rowTemplate(item) {
      return `<tr>
        <td><button class="image-button" data-image="${item.image_url}" data-title="${escapeHtml(item.title)}"><img class="thumb" src="${item.image_url}" alt=""></button></td>
        <td class="title-cell">${productTitleCell(item)}</td>
        <td>${selectionScoreBadge(item.selection_score || item.pod_score, item)}</td><td>${escapeHtml(item.product_card_sales)}</td><td>${salesSharePie(item.distribution_7d_chart)}</td><td>${salesSharePie(item.distribution_28d_chart)}</td>
        <td>${escapeHtml(item.total_sold_count)}</td><td>${escapeHtml(item.sales_growth)}</td><td>${escapeHtml(item.product_card_ratio_28d || item.product_card_ratio)}</td>
        <td>${escapeHtml(item.launch_time)}</td><td>${escapeHtml(item.rating)}</td><td>${gradeBadge(item.ip_grade, item)}</td>
        <td>${materialBadge(item)}${reasonPreview('材质判断原因', item.material_reason)}</td>
        <td>${illustrationStatusBadge(item.illustration_status, item.illustration_result_url)}${statusSelect(item)}</td><td>${platformLinks(item)}</td>
        <td><button data-detail="${item.product_id}" data-date="${item.date_record}">站内详情</button></td>
      </tr>`;
    }

    function renderCards() {
      const label = state.periodLabel;
      $('content').innerHTML = `<div class="card-grid">${state.items.map(item => `<article class="product-card">
        <button class="card-image-button" data-image="${item.image_url}" data-title="${escapeHtml(item.title)}"><img src="${item.image_url}" alt=""></button><div class="card-body"><h3>${escapeHtml(item.title)}</h3><p>${item.product_id} · ${item.date_record || ''}</p>
        <div class="badges">${gradeBadge(item.ip_grade, item)}${materialBadge(item)}</div>
        <div class="metrics"><span>价格 ${escapeHtml(item.price)}</span><span title="按当前选择的采集日期范围，对该商品每天的销量字段求和展示。">销量 ${escapeHtml(item.sold_count)}</span><span>总销量 ${escapeHtml(item.total_sold_count)}</span><span>${label}成交额 ${escapeHtml(item.sale_amount)}</span><span>达人 ${escapeHtml(item.author_count)}</span><span>视频 ${escapeHtml(item.video_ratio)}</span><span>商品卡 ${escapeHtml(item.product_card_ratio)}</span></div>
        <div class="card-actions">${statusSelect(item)}${platformLinks(item)}<button data-detail="${item.product_id}" data-date="${item.date_record}">站内详情</button></div></div>
      </article>`).join('')}</div>`;
      bindRowActions();
    }

    function salesSharePie(items = []) {
      const colors = ['#5d82ff', '#86e7bd', '#ff5b92'];
      const list = Array.isArray(items) ? items : [];
      const values = list.map(item => numericDisplayValue(item.sales ?? 0));
      let total = values.reduce((sum, value) => sum + value, 0);
      if (total <= 0) {
        values.splice(0, values.length, ...list.map(item => percentNumber(item.ratio)));
        total = values.reduce((sum, value) => sum + value, 0);
      }
      if (total <= 0) return '<span class="mini-pie-empty">暂无</span>';
      let cursor = 0;
      const stops = values.map((value, index) => {
        const start = cursor;
        cursor += (value / total) * 100;
        return `${colors[index % colors.length]} ${start}% ${cursor}%`;
      }).join(', ');
      return `<div class="mini-share">
        <span class="mini-pie" style="background: conic-gradient(${stops});"></span>
        <span class="mini-share-list">${list.map((item, index) => `<em><i style="background:${colors[index % colors.length]}"></i>${escapeHtml(item.name)} ${escapeHtml(item.ratio || '0%')}</em>`).join('')}</span>
      </div>`;
    }

    function percentNumber(value) {
      const text = String(value ?? '').replace('%', '').replace(',', '').trim();
      const number = Number(text);
      if (!Number.isFinite(number)) return 0;
      return number <= 1 && number > 0 ? number * 100 : number;
    }

    function sortHeader(field, label) {
      const active = state.sortBy === field;
      const arrow = active ? (state.sortOrder === 'asc' ? '↑' : '↓') : '↕';
      return `<button class="sort-header ${active ? 'active' : ''}" data-sort="${field}" type="button">${label}<span>${arrow}</span></button>`;
    }

    function bindSortHeaders() {
      document.querySelectorAll('[data-sort]').forEach(btn => {
        btn.addEventListener('click', () => {
          const field = btn.dataset.sort;
          if (state.sortBy === field) {
            state.sortOrder = state.sortOrder === 'asc' ? 'desc' : 'asc';
          } else {
            state.sortBy = field;
            state.sortOrder = 'desc';
            $('sortBy').value = field;
          }
          state.page = 1;
          loadProducts();
        });
      });
    }

    function bindRowActions() {
      document.querySelectorAll('[data-detail]').forEach(btn => btn.addEventListener('click', () => openDetail(btn.dataset.detail, btn.dataset.date)));
      document.querySelectorAll('[data-image]').forEach(btn => btn.addEventListener('click', () => openImage(btn.dataset.image, btn.dataset.title)));
      document.querySelectorAll('[data-reason-title]').forEach(btn => btn.addEventListener('click', () => openReason(btn.dataset.reasonTitle, btn.dataset.reasonText, btn.dataset.productTitle, btn.dataset.ipGrade, btn.dataset.productId, btn.dataset.dateRecord, btn.dataset.source)));
      document.querySelectorAll('[data-score-detail]').forEach(btn => btn.addEventListener('click', () => openScoreDetail(btn.dataset.scoreDetail, btn.dataset.date)));
      document.querySelectorAll('[data-illustration-check]').forEach(btn => btn.addEventListener('click', () => checkIllustrationExtractability(btn)));
      document.querySelectorAll('[data-status-product]').forEach(select => select.addEventListener('change', () => updateStatus(select)));
      document.querySelectorAll('[data-product-title]').forEach(el => {
        el.addEventListener('mouseenter', () => showProductTitleTooltip(el));
        el.addEventListener('mousemove', () => positionProductTitleTooltip(el));
        el.addEventListener('mouseleave', hideProductTitleTooltip);
      });
      document.querySelectorAll('[data-copy-title]').forEach(btn => btn.addEventListener('click', event => {
        event.stopPropagation();
        event.preventDefault();
        copyProductTitle(btn);
      }));
      document.querySelectorAll('[data-translate-title]').forEach(btn => btn.addEventListener('click', event => {
        event.stopPropagation();
        event.preventDefault();
        translateProductTitle(btn);
      }));
    }

    async function checkIllustrationExtractability(btn) {
      const productId = btn.dataset.illustrationCheck;
      const dateRecord = btn.dataset.date || '';
      btn.disabled = true;
      const oldText = btn.textContent;
      btn.textContent = '判断中...';
      try {
        const res = await fetch(`/api/products/${state.source}/${encodeURIComponent(productId)}/illustration-check`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ date_record: dateRecord }),
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '插画判断失败');
        const data = json.data || {};
        const applyResult = item => {
          if (!item) return;
          item.illustration_extractable = data.illustration_extractable;
          item.illustration_extract_reason = data.illustration_extract_reason;
        };
        state.items
          .filter(item => String(item.product_id) === String(productId) && String(item.date_record || '') === String(dateRecord || ''))
          .forEach(applyResult);
        if (currentDetailItem && String(currentDetailItem.product_id) === String(productId)) {
          applyResult(currentDetailItem);
          renderDetailDialog();
        }
        showToast(json.data?.illustration_extract_reason || '插画判断已完成');
        loadProducts();
      } catch (error) {
        btn.disabled = false;
        btn.textContent = oldText;
        showToast(error.message || '插画判断失败');
      }
    }

    function openImage(src, title) {
      $('largeImage').src = src;
      $('largeImage').alt = title || '商品图片';
      $('imageDialog').showModal();
    }

    function openScoreDetail(productId, dateRecord) {
      const item = state.items.find(row => String(row.product_id) === String(productId) && String(row.date_record || '') === String(dateRecord || ''))
        || state.items.find(row => String(row.product_id) === String(productId))
        || currentDetailItem;
      if (!item) return showToast('未找到该商品的评分数据');
      $('scoreDialogBody').innerHTML = scoreDetailHtml(item);
      bindScoreFormulaHelp($('scoreDialogBody'));
      $('scoreDialog').showModal();
    }

    function parseScoreDetail(item) {
      const rawReason = item?.score_reason || item?.pod_score_reason || '';
      const score = Number(item?.selection_score ?? item?.pod_score);
      let detail = {};
      if (rawReason && String(rawReason).trim().startsWith('{')) {
        detail = parseMaybeJson(rawReason) || {};
      }
      const components = detail.components || {};
      const inputs = detail.inputs || {};
      const benchmark = detail.benchmark || {};
      return {
        score: Number.isFinite(score) ? score : 0,
        summary: detail.summary || (rawReason && !String(rawReason).trim().startsWith('{') ? rawReason : ''),
        conclusion: detail.conclusion || scoreConclusion(score),
        risk: detail.risk || '',
        components,
        inputs,
        benchmark,
      };
    }

    function scoreSummaryText(item) {
      const detail = parseScoreDetail(item);
      return detail.summary || detail.conclusion || '';
    }

    function scoreConclusion(score) {
      const value = Number(score);
      if (!Number.isFinite(value)) return '未评分';
      if (value >= 75) return '推荐上架';
      if (value >= 50) return '观察等待';
      return '暂不上架';
    }

    function scoreDetailHtml(item) {
      const detail = parseScoreDetail(item);
      const c = detail.components || {};
      const inputs = detail.inputs || {};
      const benchmark = detail.benchmark || {};
      const summary = detail.summary || '暂无评分原因明细，建议重新执行选品分回算后查看完整拆解。';
      const rawSales30Ratio = finiteOr(c.raw_sales_30d_ratio, safeRatio(inputs.sales_30d, benchmark.max_sales_30d));
      const rawVideoRatio = finiteOr(c.raw_video_ratio, safeRatio(inputs.video_count, benchmark.max_video_count));
      const salesCurveRatio = finiteOr(c.sales_curve_ratio, safeRatio(c.sales_score, 35));
      const heatCurveRatio = finiteOr(c.heat_curve_ratio, safeRatio(c.heat_score, 25));
      const trendCurveRatio = finiteOr(c.trend_curve_ratio, Math.min(1, Number(c.trend_ratio) || 0));
      return `<section class="score-detail-panel">
        <div class="score-detail-summary">
          <div>
            <span>综合得分</span>
            <strong>${formatScoreNumber(detail.score)}</strong>
          </div>
          <div>
            <span>推荐结论</span>
            <strong>${escapeHtml(detail.conclusion || scoreConclusion(detail.score))}</strong>
          </div>
        </div>
        <p>${escapeHtml(summary)}</p>
        ${detail.risk ? `<div class="score-risk">风控命中：${escapeHtml(detail.risk)}</div>` : ''}
        <div class="score-breakdown-grid">
          ${scorePartCard('销量分', c.sales_score, 35, [
            ['30天销量', formatScoreNumber(inputs.sales_30d)],
            ['类目最大30天销量', formatScoreNumber(benchmark.max_sales_30d)],
            ['原始销量占比', formatPercentNumber(rawSales30Ratio)],
            ['log归一化结果', formatScoreNumber(c.norm_30d)],
            ['曲线得分比例', formatPercentNumber(salesCurveRatio)]
          ], scoreFormulaText('sales'))}
          ${scorePartCard('评分分', c.rating_score, 25, [
            ['商品评分', `${formatScoreNumber(inputs.rating)} / 5`],
            ['评分得分比例', formatPercentNumber(safeRatio(c.rating_score, 25))]
          ], scoreFormulaText('rating'))}
          ${scorePartCard('热度分', c.heat_score, 25, [
            ['视频数', formatScoreNumber(inputs.video_count)],
            ['类目最大视频数', formatScoreNumber(benchmark.max_video_count)],
            ['原始视频占比', formatPercentNumber(rawVideoRatio)],
            ['log归一化结果', formatScoreNumber(c.norm_video)],
            ['曲线得分比例', formatPercentNumber(heatCurveRatio)]
          ], scoreFormulaText('heat'))}
          ${scorePartCard('趋势分', c.trend_score, 15, [
            ['7天销量', formatScoreNumber(inputs.sales_7d)],
            ['7天log归一化', formatScoreNumber(c.norm_7d)],
            ['30天log归一化', formatScoreNumber(c.norm_30d)],
            ['趋势比', formatScoreNumber(c.trend_ratio)],
            ['封顶后比例', formatPercentNumber(trendCurveRatio)]
          ], scoreFormulaText('trend'))}
        </div>
        <div class="score-detail-kv">
          <div><span>价格</span><strong>${formatScoreNumber(inputs.price)}</strong></div>
          <div><span>总销量</span><strong>${formatScoreNumber(inputs.total_sales)}</strong></div>
          <div><span>类目基准</span><strong>${escapeHtml(benchmark.category_key || '未分组')}</strong></div>
          <div><span>归一化说明</span><strong>分数使用 log 归一化，不是直接用原始销量占比。</strong></div>
        </div>
      </section>`;
    }

    function scorePartCard(label, value, max, rows, formula) {
      const numeric = Number(value);
      const safeValue = Number.isFinite(numeric) ? numeric : 0;
      const percent = max > 0 ? Math.max(0, Math.min(100, (safeValue / max) * 100)) : 0;
      return `<div class="score-part-card">
        <div class="score-part-head">
          <span>${escapeHtml(label)}${formula ? `<button type="button" class="score-formula-help" data-score-formula="${escapeHtml(formula)}" aria-label="查看评分公式">?</button>` : ''}</span>
          <strong>${formatScoreNumber(safeValue)} / ${max}</strong>
        </div>
        <div class="score-part-track"><i style="width:${percent.toFixed(2)}%"></i></div>
        <div class="score-param-list">${(Array.isArray(rows) ? rows : []).map(([name, rowValue]) => `<div><span>${escapeHtml(name)}</span><strong>${escapeHtml(rowValue)}</strong></div>`).join('')}</div>
        <div class="score-formula-popover" hidden></div>
      </div>`;
    }

    function scoreFormulaText(type) {
      const formulas = {
        sales: '销量分：norm30d = log10(30天销量+1) / log10(类目最大30天销量+1)；penalty = |norm30d - 0.5| × 0.67；销量分 = norm30d × (1 - penalty) × 2 × 35。当前系统会按维度满分封顶，避免超过35分。',
        rating: '评分分：评分分 = (评分 / 5) × 25；无评分时按3.5计算。',
        heat: '热度分：normVideo = log10(视频数+1) / log10(类目最大视频数+1)；penalty = |normVideo - 0.5| × 0.67；热度分 = normVideo × (1 - penalty) × 2 × 25。当前系统会按维度满分封顶，避免超过25分。',
        trend: '趋势分：norm7d = log10(7天销量+1) / log10(类目最大7天销量+1)；ratio = norm7d / norm30d；趋势分 = min(1, ratio) × 15。',
      };
      return formulas[type] || '';
    }

    function formatScoreNumber(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '--';
      return Number.isInteger(number) ? String(number) : number.toFixed(2);
    }

    function formatPercentNumber(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '--';
      return `${(number * 100).toFixed(2)}%`;
    }

    function safeRatio(value, base) {
      const left = Number(value);
      const right = Number(base);
      if (!Number.isFinite(left) || !Number.isFinite(right) || right <= 0) return NaN;
      return left / right;
    }

    function finiteOr(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    let currentDetailItem = null;
    let currentDetailPeriod = '7d';
    let currentDistributionView = 'bar';
    let currentSkuRule = null;
    let currentSkuView = 'bar';

    async function openDetail(productId, dateRecord) {
      const res = await fetch(`/api/products/${state.source}/${productId}?date_record=${encodeURIComponent(dateRecord || '')}`);
      const json = await res.json();
      if (!json.ok) return showToast(json.error || '详情加载失败');
      currentDetailItem = json.data;
      currentDetailPeriod = state.period === '30d' ? '30d' : '7d';
      currentSkuRule = null;
      currentSkuView = 'bar';
      renderDetailDialog();
      $('detailDialog').showModal();
    }

    window.setDetailPeriod = function(period) {
      currentDetailPeriod = period;
      currentSkuRule = null;
      renderDetailDialog();
    };

    function renderDetailDialog() {
      if (!currentDetailItem) return;
      $('detailBody').innerHTML = renderProductDetail(currentDetailItem, currentDetailPeriod);
      bindDetailControls();
    }

    function bindDetailControls() {
      document.querySelectorAll('[data-distribution-view]').forEach(btn => btn.addEventListener('click', () => {
        currentDistributionView = btn.dataset.distributionView;
        renderDetailDialog();
      }));
      document.querySelectorAll('[data-sku-rule]').forEach(btn => btn.addEventListener('click', () => {
        currentSkuRule = btn.dataset.skuRule;
        renderDetailDialog();
      }));
      document.querySelectorAll('[data-sku-view]').forEach(btn => btn.addEventListener('click', () => {
        currentSkuView = btn.dataset.skuView;
        renderDetailDialog();
      }));
      document.querySelectorAll('[data-analysis-detail]').forEach(btn => btn.addEventListener('click', () => loadDetailedAnalysis(btn)));
      document.querySelectorAll('[data-open-detail-analysis]').forEach(btn => btn.addEventListener('click', () => {
        $('detailDialog').close();
        openDetailAnalysisWorkspace(btn.dataset.openDetailAnalysis || state.detailAnalysisType);
      }));
      document.querySelectorAll('[data-illustration-check]').forEach(btn => btn.addEventListener('click', () => checkIllustrationExtractability(btn)));
      document.querySelectorAll('[data-translate-selling-points]').forEach(btn => btn.addEventListener('click', () => translateSellingPoints(btn)));
      bindScoreFormulaHelp($('detailBody'));
    }

    function bindScoreFormulaHelp(root = document) {
      root.querySelectorAll('[data-score-formula]').forEach(btn => {
        if (btn.dataset.boundFormula === '1') return;
        btn.dataset.boundFormula = '1';
        btn.addEventListener('click', event => {
          event.preventDefault();
          event.stopPropagation();
          const card = btn.closest('.score-part-card');
          const box = card?.querySelector('.score-formula-popover');
          if (!box) return;
          const shouldShow = box.hidden;
          root.querySelectorAll('.score-formula-popover').forEach(item => { item.hidden = true; });
          if (shouldShow) {
            box.textContent = btn.dataset.scoreFormula || '';
            box.hidden = false;
          }
        });
      });
    }

    function openReason(title, text, productTitle = '', grade = '', productId = '', dateRecord = '', source = '') {

        currentDetailItem = {
          ...(currentDetailItem || {}),
          source: source || state.source,
          product_id: productId,
          date_record: dateRecord,
          title: productTitle,
        };
      }
      $('detailBody').innerHTML = title.includes('IP')

        </div>
        ${(attributesText || sellingPointsText) ? `<section class="detail-section detail-extra-info">

            ${sellingPointsText ? `<div class="detail-info-block detail-selling-points-block">

        <section class="detail-section">

        || raw[`distribution_${period}`];

    function distributionPanel(title, distribution) {
      const items = Array.isArray(distribution) ? distribution : [];
      if (!items.length) return `<div class="detail-panel"><h5>${escapeHtml(title)}</h5><div class="detail-empty">暂无占比数据</div></div>`;
      const visibleItems = items.slice(0, 6);
      return `<div class="detail-panel">
        <div class="detail-panel-headline">
          <h5>${escapeHtml(title)}</h5>
          <div class="detail-chart-switch">
            <button type="button" class="${currentDistributionView === 'bar' ? 'active' : ''}" data-distribution-view="bar">条形图</button>

    function distributionDonutTable(items) {
      const colors = ['#ff5b92', '#86e7bd', '#5d82ff', '#f59e0b', '#8b5cf6', '#06b6d4'];
      const values = items.map(item => distributionSalesNumber(item));
      const total = values.reduce((sum, value) => sum + value, 0) || 100;
      let cursor = 0;
      const stops = values.map((value, index) => {
        const start = cursor;
        cursor += (value / total) * 100;
        return `${colors[index % colors.length]} ${start}% ${cursor}%`;
      }).join(', ');
      return `<div class="detail-donut-layout">
        <div class="detail-donut" style="background: conic-gradient(${stops});"></div>
        <div class="detail-distribution-table">
          <div class="detail-distribution-head">
            <span>类目</span><span>占比</span><span>销量</span>
          </div>
          ${items.map((item, index) => {
          const name = item.name || item.type || item.label || `渠道${index + 1}`;
          const value = distributionSalesValue(item);
          const ratio = total ? `${Math.round((values[index] / total) * 100)}%` : normalizePercent(item.percentage ?? item.ratio ?? item.value);
          return `<div class="detail-distribution-row">
            <span><i style="background:${colors[index % colors.length]}"></i>${escapeHtml(name)}</span>
            <strong>${escapeHtml(ratio)}</strong>
            <em>${escapeHtml(value)}</em>
          </div>`;
        }).join('')}
        </div>
      </div>`;
    }

    function distributionBarTable(items) {
      const values = items.map(item => distributionSalesNumber(item));
      const total = values.reduce((sum, value) => sum + value, 0) || 100;
      return `<div class="detail-bars">${items.map((item, index) => {
        const name = item.name || item.type || item.label || `渠道${index + 1}`;
        const value = distributionSalesValue(item);
        const ratio = total ? `${Math.round((values[index] / total) * 100)}%` : normalizePercent(item.percentage ?? item.ratio ?? item.value);
        return `<div class="detail-bar-row">
          <div><strong>${escapeHtml(name)}</strong><span>${escapeHtml(value)}</span></div>
          <div class="detail-bar-track"><i style="width:${escapeHtml(ratio)}"></i></div>
          <em>${escapeHtml(ratio)}</em>
        </div>`;
      }).join('')}</div>`;
    }

    function distributionSalesValue(item) {
      return detailValue(item.sales, item.sold, item.count, item.value_count, item.销量, item['销量'], item.value, 0);
    }

    function distributionSalesNumber(item) {
      return numericDisplayValue(distributionSalesValue(item));
    }

    function numericDisplayValue(value) {
      if (value === null || value === undefined || value === '') return 0;
      const text = String(value)
        .replace(/US\$|USD|\$|¥|￥|%|,/g, '')
        .replace(/，/g, '')
        .trim();
      const number = Number(text);
      if (!Number.isFinite(number)) return 0;
      return String(value).includes('万') ? number * 10000 : number;
    }

    function skuAnalysisSection(item, period) {
      const sku = detailSkuAnalysis(item, period);
      if (!sku) return '';
      const dimensions = Array.isArray(sku.dimensions) ? sku.dimensions : [];
      if (!dimensions.length) return '';
      const activeRule = currentSkuRule && dimensions.some(dim => dim.name === currentSkuRule)
        ? currentSkuRule
        : dimensions[0].name;
      const dimension = dimensions.find(dim => dim.name === activeRule) || dimensions[0];
      const items = (dimension.items || []).slice(0, 6);
      const best = sku.best_sku;
      const bestText = best && best.name
        ? `表现最佳SKU：${best.rule} - ${best.name} ｜ 销量 ${best.sales_display || best.sales || 0}`
        : '暂无表现最佳SKU';
      return `<section class="detail-section sku-section">
        <div class="detail-section-head">
          <h4>SKU分析</h4>
          <span>${escapeHtml(sku.period_label || (period === '30d' ? '近28天' : '近7天'))}</span>
        </div>
        <div class="sku-best">${escapeHtml(bestText)}</div>
        <div class="sku-rule-row">
          <span>筛选规则：</span>
          ${dimensions.map(dim => `<button type="button" class="${dim.name === activeRule ? 'active' : ''}" data-sku-rule="${escapeHtml(dim.name)}">${escapeHtml(dim.name)}</button>`).join('')}
        </div>
        <div class="detail-panel sku-chart-panel">
          <div class="detail-panel-headline">
            <h5>成交占比(${escapeHtml(sku.period_label || '')})</h5>
            <div class="detail-chart-switch">
              <button type="button" class="${currentSkuView === 'bar' ? 'active' : ''}" data-sku-view="bar">条形图</button>
              <button type="button" class="${currentSkuView === 'pie' ? 'active' : ''}" data-sku-view="pie">饼图</button>
            </div>
          </div>
          ${items.length ? (currentSkuView === 'pie' ? skuDonutTable(items) : skuBarTable(items)) : '<div class="detail-empty">暂无SKU销量数据</div>'}
        </div>
      </section>`;
    }

    function detailSkuAnalysis(item, period) {
      const fields = item.sku_analysis || {};
      const key = period === '30d' ? '28d' : '7d';
      return fields[key] || null;
    }

    function skuDonutTable(items) {
      const colors = ['#ff5b92', '#86e7bd', '#5d82ff', '#f59e0b', '#8b5cf6', '#06b6d4'];
      const values = items.map(item => numericDisplayValue(item.sales ?? item.sales_display ?? 0));
      const total = values.reduce((sum, value) => sum + value, 0) || 100;
      let cursor = 0;
      const stops = values.map((value, index) => {
        const start = cursor;
        cursor += (value / total) * 100;
        return `${colors[index % colors.length]} ${start}% ${cursor}%`;
      }).join(', ');
      return `<div class="detail-donut-layout sku-donut-layout">
        <div class="detail-donut sku-donut" style="background: conic-gradient(${stops});"></div>
        <div class="detail-distribution-table">
          <div class="detail-distribution-head">
            <span>规格</span><span>占比</span><span>销量</span>
          </div>
          ${items.map((item, index) => {
          const ratio = total ? `${Math.round((values[index] / total) * 100)}%` : (item.ratio || '0%');
          return `<div class="detail-distribution-row">
            <span><i style="background:${colors[index % colors.length]}"></i>${escapeHtml(item.name || `规格${index + 1}`)}</span>
            <strong>${escapeHtml(ratio)}</strong>
            <em>${escapeHtml(item.sales_display ?? item.sales ?? 0)}</em>
          </div>`;
        }).join('')}
        </div>
      </div>`;
    }

    function skuBarTable(items) {
      const values = items.map(item => numericDisplayValue(item.sales ?? item.sales_display ?? 0));
      const total = values.reduce((sum, value) => sum + value, 0) || 100;
      return `<div class="detail-bars sku-bars">${items.map((item, index) => {
        const ratio = total ? `${Math.round((values[index] / total) * 100)}%` : (item.ratio || '0%');
        return `<div class="detail-bar-row">
          <div><strong>${escapeHtml(item.name || `规格${index + 1}`)}</strong><span>${escapeHtml(item.sales_display ?? item.sales ?? 0)}</span></div>
          <div class="detail-bar-track"><i style="width:${escapeHtml(ratio)}"></i></div>
          <em>${escapeHtml(ratio)}</em>
        </div>`;
      }).join('')}</div>`;
    }

    function overviewPanel(title, overview) {
      if (!overview || !Object.keys(overview).length) return `<div class="detail-panel"><h5>${escapeHtml(title)}</h5><div class="detail-empty">暂无周期指标</div></div>`;
      const baseKeys = Object.keys(overview).filter(k => !k.startsWith('日均') && overview[k] !== null && overview[k] !== '' && overview[k] !== undefined);
      if (!baseKeys.length) return `<div class="detail-panel"><h5>${escapeHtml(title)}</h5><div class="detail-empty">暂无周期指标</div></div>`;

      const html = baseKeys.slice(0, 10).map(key => {
        const val = overview[key];
        const dailyKey = `日均${key}`;
        const dailyVal = overview[dailyKey];
        let dailyHtml = '';
        if (dailyVal !== undefined && dailyVal !== null && dailyVal !== '') {
          dailyHtml = `<small style="display:block; color:#9ca3af; font-size:11px; margin-top:4px; font-weight:normal;">日均 ${escapeHtml(dailyVal)}</small>`;
        }
        return `<div><span>${escapeHtml(key)}</span><strong style="margin-top:6px;">${escapeHtml(val)}</strong>${dailyHtml}</div>`;
      }).join('');

      return `<div class="detail-panel"><h5>${escapeHtml(title)}</h5><div class="detail-kv-grid">${html}</div></div>`;
    }

    function materialAnalysisHtml(value) {
      const material = parseMaybeJson(value) || {};
      if (!Object.keys(material).length) return `<div class="detail-panel"><h5>材质分析</h5><div class="detail-empty">暂无材质分析</div></div>`;
      return `<div class="detail-panel"><h5>材质分析</h5><div class="detail-kv-grid">
        <div><span>类型</span><strong>${escapeHtml(material.material_type || '--')}</strong></div>
        <div><span>细分</span><strong>${escapeHtml(material.material_category || '--')}</strong></div>
        <div><span>置信度</span><strong>${escapeHtml(material.confidence || '--')}</strong></div>
      </div><p class="detail-note">${escapeHtml(material.material_reason || '')}</p></div>`;
    }

    function materialSummaryBadge(value) {
      const material = parseMaybeJson(value) || {};
      return material.material_type ? `<span>${escapeHtml(material.material_type)}</span>` : '';
    }

    function detailValue(...values) {
      for (const value of values) {
        if (value !== null && value !== undefined && value !== '') return String(value);
      }
      return '';
    }

    function parseMaybeJson(value) {
      if (!value) return null;
      if (typeof value === 'object') return value;
      try { return JSON.parse(value); } catch (error) { return null; }
    }

    function normalizePercent(value) {
      if (value === null || value === undefined || value === '') return '0%';
      const text = String(value);
      if (text.includes('%')) return text;
      const number = Number(text);
      if (!Number.isFinite(number)) return '0%';
      return `${number <= 1 ? Math.round(number * 100) : Math.round(number)}%`;
    }

    async function updateStatus(select) {
      const productId = select.dataset.statusProduct, dateRecord = select.dataset.statusDate, auditStatus = select.value;
      if (!confirm(`确认将该商品状态修改为「${statusText[auditStatus]}」？`)) { select.value = select.dataset.previous; return; }
      const res = await fetch(`/api/products/${state.source}/${productId}/status`, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({date_record: dateRecord, audit_status: auditStatus}) });
      const json = await res.json();
      if (!json.ok) { select.value = select.dataset.previous; return showToast(json.error || '状态修改失败'); }
      select.dataset.previous = auditStatus; showToast('状态已更新'); loadStats();

    function gradeBadge(grade, item = null) {
      if (!grade) return '<span class="badge muted">未分析</span>';

        return `<button type="button" class="badge grade-${grade} badge-button" data-reason-title="IP 简要分析" data-reason-text="${escapeHtml(item.ip_reason || '')}" data-product-title="${escapeHtml(item.title || '')}" data-ip-grade="${escapeHtml(grade)}" data-product-id="${escapeHtml(item.product_id || '')}" data-date-record="${escapeHtml(item.date_record || '')}" data-source="${escapeHtml(item.source || state.source)}">IP ${escapeHtml(grade)}</button>`;
